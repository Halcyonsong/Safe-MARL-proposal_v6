seed: 0
env:
  num_agents: 8
  area_size: 4.0
  max_step: 256
  num_obstacles: 8
  n_rays: 32
  max_neighbors: 5
policy:
  actor_hidden_dims:
  - 256
  - 256
  critic_hidden_dims:
  - 256
  - 256
  cost_hidden_dims:
  - 256
  - 256
