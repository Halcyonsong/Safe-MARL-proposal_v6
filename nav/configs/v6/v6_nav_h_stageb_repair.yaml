# V6 navigation Stage-B repair: Ant-faithful predictive h training.
#
# Stage B failed because the h checkpoint did not learn the future-min target
# (val target corr 0.079 vs Ant 0.811) even though its unsafe/safe
# classification was strong.  The repair keeps the same V6-owned data sources
# and safety-only inputs but changes only the h objective and data mix:
#
# * wall-free future-min target (the graph h cannot observe absolute position
#   and the official nav cost does not penalise the outer wall),
# * SmoothL1(beta=1.0) target loss instead of Huber(delta=0.1),
# * explicit diagonal state-gradient alignment to the analytic geometric
#   safety direction,
# * 40 epochs at 1e-3, matching the Ant predictive-h protocol,
# * h_dot disabled so it cannot dominate the target signal,
# * checkpoint selection driven by target correlation and gradient alignment,
#   with balanced accuracy only as a small tie-breaker.
#
# No V5/Ant data, weights, margins, or thresholds are used.  The actor is
# retrained from scratch after this h passes its offline guardrails.
env:
  area_size: 4.0
  max_neighbors: 5
  max_step: 256
  n_rays: 32
  num_agents: 8
  num_obstacles: 8
h:
  arch: v6_safety_graph
  batch_size: 256
  checkpoint: outputs/v6/independent/h_stageb_repair/v6_h_stageb_repair.pkl
  co_train: false
  h_offset: null
  h_scale: null
  lr: 0.001
  replay_size: 2048
  train:
    alpha: 0.1
    arch: graph
    batch_size: 256
    comm_radius: 0.5
    data: outputs/v6/independent/data_stageb_repair
    dt: 0.03
    episodes: 200
    epochs: 40
    gnn_layers: 1
    grad_coef: 0.1
    grad_eval_rows: 256
    grad_fd_eps: 0.001
    grad_max_rows: 16
    grad_on_all: true
    graph_hidden: 128
    graph_layers: 2
    hdot_alpha: 1.0
    hdot_coef: 0.0
    hdot_eps: 0.02
    hdot_safe_only: true
    max_grad_norm: 1.0
    hidden:
    - 256
    - 256
    invariance_coef: 0.0
    lr: 0.001
    margin: 0.05
    margin_coef: 0.0
    out: outputs/v6/independent/h_stageb_repair
    safe_margin: 0.02
    target_key: graph_margin_targets
    target_coef: 0.5
    target_loss_delta: 1.0
    target_on_all: true
    steps: 256
    tag: v6_h_stageb_repair
    train_data: outputs/v6/independent/data_stageb_repair/train_data.npz
    unsafe_weight: 1.0
    weight_decay: 0.0001
  update_epochs: 2
  update_every: 1
  use_features: true
  feature_scale: 1.0
  use_losses: false
  weight_decay: 0.0001
policy:
  correction_radius: 0.3
  hidden: 256
  init_checkpoint: null
  initial_log_std: -1.0
seed: 0
task_value:
  arch: graph
  batch_size: 256
  clip: 3.0
  ema_decay: 0.99
  epochs: 8
  graph_hidden: 128
  graph_layers: 2
  hidden:
  - 256
  - 256
  lr: 0.0003
  var_floor: 1.0
  warmup_count: 1024
training:
  alpha: 0.1
  barrier_coef: 0.0
  barrier_margin: 0.1
  cbf_alpha: 1.0
  cbf_coef: 0.0
  cbf_eps: 0.02
  clip_range: 0.2
  correction_coef: 0.01
  cost_actor_coef: 0.5
  cost_coef: 1.0
  device: auto
  entropy_coef: 0.005
  epochs: 4
  eval_episodes: 20
  eval_interval: 2048
  eval_seed: 10000
  deterministic: true
  gae_lambda: 0.95
  gamma: 0.99
  h_barrier_coef: 0.0
  h_barrier_margin: 0.05
  gradient_coef: 0.0
  gradient_margin: 0.5
  invariance_coef: 0.0
  lr: 0.0003
  mass: 0.1
  max_grad_norm: 0.5
  minibatch_size: 256
  reach_bonus: 5.0
  reward_scale: 20.0
  rollout_steps: 128
  save_interval: 0
  task_grad_scale: 0.5
  task_grad_start_steps: 1024
  terminal_reach_bonus: 20.0
  total_steps: 16384
  unsafe_penalty: 10.0
  use_task_grad: false
  use_task_scalar: false
  value_coef: 0.5
