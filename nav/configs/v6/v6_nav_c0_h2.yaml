# V6 navigation Stage C0: h2-only temporal-calibration screen.
#
# Hypothesis: h1 was trained on h-only seed0 / Stage-A seed0 rollouts, not the
# final repaired Stage-B actor1.  Retraining h on actor1 stochastic rollouts
# (plus the same fixed random coverage) should reduce the 17-32-step
# risk-region error and lengthen the warning lead.
#
# Scope: h only.  No actor2 training, no closed-loop evaluation in C0, no gate
# scope / cost / task-channel change.  Same target, architecture, loss, and
# calibration rule as the repaired h1.  Retrain from scratch.
#
# Independence rules: V6-owned data, h, and checkpoints only.  No official h,
# cbf.pkl, QP/u_ref, expert labels/actions, V5/V4 artifacts, or pretrained
# weights.

env:
  area_size: 4.0
  max_neighbors: 5
  max_step: 256
  n_rays: 32
  num_agents: 8
  num_obstacles: 8

h:
  arch: v6_safety_graph
  batch_size: 256
  # Placeholder for the seed-0 h2 checkpoint; the C0 runner passes --out.
  checkpoint: outputs/v6/independent/h_c0/seed0/v6_h_c0.pkl
  co_train: false
  feature_scale: 1.0
  h_offset: null
  h_scale: null
  lr: 0.001
  replay_size: 2048
  update_epochs: 2
  update_every: 1
  use_features: true
  use_losses: false
  train:
    alpha: 0.1
    arch: graph
    batch_size: 256
    comm_radius: 0.5
    # Placeholders; the C0 runner passes per-seed data paths.
    data: outputs/v6/independent/data_c0_h2/seed0_merged
    train_data: outputs/v6/independent/data_c0_h2/seed0_merged/train_data.npz
    dt: 0.03
    episodes: 100
    epochs: 40
    gnn_layers: 1
    grad_coef: 0.1
    grad_eval_rows: 256
    grad_fd_eps: 0.001
    grad_max_rows: 16
    grad_on_all: true
    graph_hidden: 128
    graph_layers: 2
    hdot_alpha: 1.0
    hdot_coef: 0.0
    hdot_eps: 0.02
    hdot_safe_only: true
    hidden:
    - 256
    - 256
    invariance_coef: 0.0
    lr: 0.001
    margin: 0.05
    margin_coef: 0.0
    max_grad_norm: 1.0
    out: outputs/v6/independent/h_c0/seed0
    safe_margin: 0.02
    steps: 256
    tag: v6_h_c0
    target_key: graph_margin_targets
    target_coef: 0.5
    target_loss_delta: 1.0
    target_on_all: true
    unsafe_weight: 1.0
    weight_decay: 0.0001

policy:
  correction_radius: 0.3
  hidden: 256
  init_checkpoint: null
  initial_log_std: -1.0

seed: 0

task_value:
  arch: graph
  batch_size: 256
  clip: 3.0
  ema_decay: 0.99
  epochs: 8
  graph_hidden: 128
  graph_layers: 2
  hidden:
  - 256
  - 256
  lr: 0.0003
  var_floor: 1.0
  warmup_count: 1024

training:
  # Reserved for Stage C1; C0 does not train an actor.
  alpha: 0.1
  barrier_coef: 0.0
  barrier_margin: 0.1
  cbf_alpha: 1.0
  cbf_coef: 0.0
  cbf_eps: 0.02
  clip_range: 0.2
  correction_coef: 0.01
  cost_actor_coef: 0.5
  cost_coef: 1.0
  device: auto
  deterministic: true
  entropy_coef: 0.005
  epochs: 4
  eval_episodes: 20
  eval_interval: 2048
  eval_seed: 10000
  gae_lambda: 0.95
  gamma: 0.99
  gradient_coef: 0.0
  gradient_margin: 0.5
  h_barrier_coef: 0.0
  h_barrier_margin: 0.05
  invariance_coef: 0.0
  lr: 0.0003
  mass: 0.1
  max_grad_norm: 0.5
  minibatch_size: 256
  reach_bonus: 5.0
  reward_scale: 20.0
  rollout_steps: 128
  save_interval: 0
  task_grad_scale: 0.5
  task_grad_start_steps: 1024
  terminal_reach_bonus: 20.0
  total_steps: 16384
  unsafe_penalty: 10.0
  use_task_grad: false
  use_task_scalar: false
  value_coef: 0.5
