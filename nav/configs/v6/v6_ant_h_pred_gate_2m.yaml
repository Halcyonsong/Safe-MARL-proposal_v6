# Predictive V6 Ant h + safety-gated forward reward; 2M matched gate.
# h predicts the minimum future geometry margin over the next 32 steps.
# Gate is applied only to the forward component during training.
seed: 0
out: outputs/v6/independent/ant/mappo_h_pred_gate_2m
env:
  episode_limit: 1000
  agent_obsk: 1
  h_scale: 0.5
  h_kappa: 0.5
  h_kappa_z: 0.2
  upright_scale: 0.2
h:
  use_features: true
  checkpoint: outputs/v6/independent/ant/h_predictive/ant_h.pkl
policy:
  actor_hidden: [64, 64]
  critic_hidden: [64, 64]
  actor_activation: relu
  critic_activation: relu
  actor_feature_norm: true
  actor_layer_norm: true
  critic_feature_norm: true
  critic_layer_norm: true
  use_value_norm: true
  action_dist: gaussian
  initial_log_std: -1.0
  h_feature_scale: 1.0
  grad_feature_scale: 1.0
training:
  total_steps: 2000000
  num_envs: 8
  rollout_steps: 2048
  epochs: 5
  minibatch_size: 400
  lr: 0.00009
  critic_lr: 0.005
  opti_eps: 0.00001
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  value_coef: 1.0
  entropy_coef: 0.01
  max_grad_norm: 10.0
  huber_delta: 10.0
  update_value_norm: true
  cost_penalty: 0.1
  cost_penalty_end: 1.0
  cost_penalty_ramp_start: 500000
  cost_penalty_ramp_steps: 1500000
  h_barrier_coef: 0.0
  h_barrier_margin: 0.1
  forward_gate_low: 0.0
  forward_gate_high: 0.05
  normalize_advantage: true
  deterministic: true
  device: cpu
  eval_interval: 250000
  eval_episodes: 20
  eval_seed: 20000
  save_interval: 1000000
