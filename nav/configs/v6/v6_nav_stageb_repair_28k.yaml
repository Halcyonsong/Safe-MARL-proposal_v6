# V6 navigation Stage B repair: repaired predictive h + progress-only gate.
# 28k budget extension of the 16k config.  The only training-protocol change
# is total_steps (16,384 -> 28,672); all hyperparameters are identical.
#
# Independence rules:
#   allowed: official navigation scene, generic network/PPO/MAPPO code,
#            V6 self-collected data, V6 self-trained h and actor;
#   forbidden: official h / cbf.pkl / QP / u_ref / expert labels/actions,
#              V5 weights, V5 data, V5 checkpoints, and any margin/offset
#              calibrated against official h.
#
# Stage B isolates h quality.  The V6 graph h is retrained from on-policy
# rollouts with a future-min-margin target, then this actor is trained from
# scratch with that frozen h.  The frozen V6 graph h gates
# only positive dense progress; reach and terminal/success bonuses stay
# unchanged.  The official collision cost is never gated and the gate is
# disabled at evaluation.  h/grad_h remain actor features; no QP, projection,
# task channel, or expert action is used.  Actor is trained from scratch.

seed: 0
env:
  num_agents: 8
  area_size: 4.0
  max_step: 256
  num_obstacles: 8
  n_rays: 32
  max_neighbors: 5

h:
  # V6-owned full-graph safety network. The implementation module is kept
  # under a legacy filename for compatibility; it never loads official h.
  arch: v6_safety_graph
  checkpoint: outputs/v6/independent/h_stageb_repair/v6_h_stageb_repair.pkl
  # No official-h affine calibration. Threshold/offset live in the V6 h
  # checkpoint and are calibrated only on V6 validation data.
  h_offset: null
  h_scale: null
  use_features: true
  # Scale only the actor's h/grad_h channels; h semantics are unchanged.
  feature_scale: 1.0
  # The invariance/gradient/barrier terms are constants w.r.t. the actor.
  # The optional action-space CBF loss is an ablation and stays off.
  use_losses: false
  co_train: false
  update_every: 1
  lr: 0.0001
  weight_decay: 0.0001
  update_epochs: 2
  batch_size: 128
  replay_size: 2048
  train:
    # V6 self-collected data only; no legacy behavior data or official-h labels.
    data: outputs/v6/independent/data_stageb
    train_data: outputs/v6/independent/data_stageb/train_data.npz
    out: outputs/v6/independent/h_stageb
    tag: v6_h_stageb
    episodes: 100
    steps: 256
    epochs: 10
    batch_size: 128
    lr: 0.0001
    weight_decay: 0.0001
    margin: 0.05
    arch: graph
    graph_hidden: 128
    graph_layers: 2
    gnn_layers: 1
    unsafe_weight: 1.0
    # Generic margin anchor for the V6 h classification target. Confirm it on
    # V6 validation only; do not copy an official-h h-swap margin/work point.
    safe_margin: 0.02
    target_key: graph_margin_targets
    target_coef: 0.5
    target_on_all: true
    margin_coef: 0.0
    hdot_coef: 0.2
    hdot_alpha: 1.0
    hdot_eps: 0.02
    # Random behavior can itself be unsafe; restrict the barrier consistency
    # term to horizon-safe states so unsafe transitions do not push h upward.
    hdot_safe_only: true
    dt: 0.03
    invariance_coef: 0.0
    alpha: 0.1
    hidden: [256, 256]

task_value:
  # Reserved for the later task-channel stage. Disabled in the h-only main
  # protocol; V_T must be trained from V6-collected task returns.
  arch: graph
  graph_hidden: 128
  graph_layers: 2
  hidden: [256, 256]
  lr: 0.0003
  epochs: 8
  batch_size: 256
  warmup_count: 1024
  clip: 3.0
  ema_decay: 0.99
  var_floor: 1.0

policy:
  hidden: 256
  correction_radius: 0.3
  initial_log_std: -1.0
  # Main V6 actor is trained from scratch. Do not load V5/V4 weights.
  init_checkpoint: null

training:
  device: cuda
  # 28k budget extension: 28,672 steps, 3 seeds, 100-episode final eval.
  # 28,672 = 224 updates x rollout_steps 128.  No schedule depends on
  # total_steps, so steps 1..16,384 match the 16k run for the same seed.
  total_steps: 28672
  rollout_steps: 128
  lr: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  # Dense safety cost from frozen V6 h; off in the main h-only arm.
  h_barrier_coef: 0.0
  h_barrier_margin: 0.05
  clip_range: 0.2
  epochs: 4
  minibatch_size: 256
  # No projection, no QP, no expert. Action-space CBF loss is an ablation.
  cbf_coef: 0.0
  cbf_alpha: 1.0
  cbf_eps: 0.02
  mass: 0.1
  value_coef: 0.5
  cost_coef: 1.0
  cost_actor_coef: 0.5
  entropy_coef: 0.005
  invariance_coef: 0.0
  gradient_coef: 0.0
  barrier_coef: 0.0
  barrier_margin: 0.1
  correction_coef: 0.01
  alpha: 0.1
  gradient_margin: 0.5
  reward_scale: 20.0
  reach_bonus: 5.0
  terminal_reach_bonus: 20.0
  unsafe_penalty: 10.0
  # Ant-style predictive safety gate for navigation.  Thresholds are
  # calibrated from the **new Stage-B h** after it is trained:
  #   low  = 0.0 (provider-space calibrated h=0 boundary)
  #   high = max(0.02, q10(h_shifted | validation label > 0))
  # Do not copy the old h's 0.0/0.13 pair.  high <= low disables the gate.
  # This is V6 nav h, not the Ant 0.05 scale.
  task_gate_low: 0.0
  # Calibrated on the repaired h validation split (2026-10-25):
  # threshold_raw=0.061149, safe shifted q10=0.267270, so the pre-registered
  # rule high=max(0.02, q10)=0.267270.  Do not sweep.
  task_gate_high: 0.26726993918418884
  task_gate_positive_only: true
  # Stage A: scale dense progress only.  Reach/terminal success bonuses are
  # intentionally un-gated so this arm differs from the first gate experiment
  # by coupling structure, not by h data, h target, or gate thresholds.
  task_gate_scope: progress_only
  max_grad_norm: 0.5
  # Monitor-only safety/task eval; final checkpoint is still used for the
  # formal claim.  This does not select or alter the actor.
  eval_interval: 8192
  eval_episodes: 20
  eval_seed: 10000
  # Separate Ant-style robustness evaluation can be enabled with
  # --eval-stochastic; formal midpoint monitoring stays deterministic.
  eval_stochastic: false
  deterministic: true
  # Retain 4k/8k/12k/16k/20k/24k/28k checkpoints.  The 16k checkpoint is the
  # paired same-run budget control; evaluation always uses fixed checkpoints.
  save_interval: 4096
  # Main protocol is h-only; task channel is deferred.
  use_task_scalar: false
  use_task_grad: false
  task_grad_start_steps: 1024
  task_grad_scale: 0.5
