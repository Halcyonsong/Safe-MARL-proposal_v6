# V6 Ant pure task MAPPO baseline, matched to the upstream V5 Ant recipe.
# No h features, no cost penalty, no V5 weights/data.
seed: 0
out: outputs/v6/independent/ant/mappo_task_base
env:
  episode_limit: 1000
  agent_obsk: 1
  h_scale: 0.5
  h_kappa: 0.0
  h_kappa_z: 0.0
  upright_scale: 0.2
h:
  use_features: false
policy:
  # Upstream MAPPO: 64-wide, ReLU, LayerNorm, feature normalization.
  actor_hidden: [64, 64]
  critic_hidden: [64, 64]
  actor_activation: relu
  critic_activation: relu
  actor_feature_norm: true
  actor_layer_norm: true
  critic_feature_norm: true
  critic_layer_norm: true
  use_value_norm: true
  action_dist: gaussian
  # std = exp(-1.0) ~= 0.368, matching V5's sigmoid(1.0)*0.5 ~= 0.365.
  initial_log_std: -1.0
  h_feature_scale: 1.0
  grad_feature_scale: 1.0
training:
  total_steps: 10000000
  num_envs: 8
  # per-environment rollout; 8 * 2048 = 16,384 transitions/update
  rollout_steps: 2048
  epochs: 5
  minibatch_size: 400
  lr: 0.00009
  critic_lr: 0.005
  opti_eps: 0.00001
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  value_coef: 1.0
  entropy_coef: 0.01
  max_grad_norm: 10.0
  huber_delta: 10.0
  update_value_norm: true
  cost_penalty: 0.0
  normalize_advantage: true
  deterministic: true
  device: cpu
  eval_interval: 500000
  eval_episodes: 20
  eval_seed: 20000
  save_interval: 1000000
