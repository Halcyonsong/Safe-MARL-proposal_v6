# Fixed-h safety-mechanism ablation (V6-independent data only).
# Main independent protocol: configs/v6/v6_nav_independent.yaml.
# The only experimental switch is training.cbf_coef:
#   0.0 -> old (inert) h losses only, i.e. h is a feature but does not shape
#          the actor through a differentiable CBF condition;
#   1.0 -> action-space CBF loss relu(-(grad_p h . v + grad_v h . u/m) - alpha*h + eps).
seed: 0
env:
  num_agents: 8
  area_size: 4.0
  max_step: 256
  num_obstacles: 8
  n_rays: 32
  max_neighbors: 5

h:
  arch: v6_safety_graph
  checkpoint: outputs/v6/independent/h/v6_h.pkl
  h_offset: null
  h_scale: null
  use_features: true
  # The old invariance/gradient/barrier terms are constants w.r.t. the actor.
  use_losses: false
  co_train: false
  update_every: 1
  lr: 0.0001
  weight_decay: 0.0001
  update_epochs: 2
  batch_size: 128
  replay_size: 2048
  train:
    data: outputs/v6/independent/data
    train_data: outputs/v6/independent/data/train_merged.npz
    out: outputs/v6/independent/h
    episodes: 60
    steps: 256
    epochs: 10
    batch_size: 128
    lr: 0.0001
    weight_decay: 0.0001
    margin: 0.05
    arch: graph
    graph_hidden: 128
    graph_layers: 2
    tag: v6_h
    gnn_layers: 1
    unsafe_weight: 1.0
    safe_margin: 0.02
    margin_coef: 0.0
    hdot_coef: 0.2
    hdot_alpha: 1.0
    hdot_eps: 0.02
    hdot_safe_only: true
    dt: 0.03
    invariance_coef: 0.0
    alpha: 0.1
    hidden: [256, 256]

task_value:
  arch: graph
  graph_hidden: 128
  graph_layers: 2
  hidden: [256, 256]
  lr: 0.0003
  epochs: 8
  batch_size: 256
  warmup_count: 1024
  clip: 3.0
  ema_decay: 0.0
  var_floor: 1.0

policy:
  hidden: 256
  correction_radius: 0.3
  initial_log_std: -1.0
  init_checkpoint: null

training:
  device: auto
  total_steps: 4096
  rollout_steps: 128
  lr: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  epochs: 4
  minibatch_size: 256
  # Action-space CBF loss; override to 1.0 for the treatment arm.
  cbf_coef: 0.0
  cbf_alpha: 1.0
  cbf_eps: 0.02
  mass: 0.1
  value_coef: 0.5
  cost_coef: 1.0
  cost_actor_coef: 0.5
  entropy_coef: 0.005
  invariance_coef: 0.0
  gradient_coef: 0.0
  barrier_coef: 0.0
  barrier_margin: 0.1
  correction_coef: 0.01
  alpha: 0.1
  gradient_margin: 0.5
  reward_scale: 20.0
  reach_bonus: 5.0
  terminal_reach_bonus: 20.0
  unsafe_penalty: 10.0
  max_grad_norm: 0.5
  eval_interval: 1024
  eval_episodes: 5
  save_interval: 0
  use_task_scalar: false
  use_task_grad: false
  task_grad_start_steps: 1024
  task_grad_scale: 0.5
